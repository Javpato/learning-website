<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercises — Chinese — Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/chinese.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="../index.html" style="color:inherit;">Learning</a></div>
    <nav>
      <a href="../index.html">Themes</a>
      <a href="index.html">Chinese</a>
    </nav>
  </header>

  <main class="page">
    <div class="crumbs"><a href="../index.html">Home</a> &nbsp;/&nbsp; <a href="index.html">Chinese</a> &nbsp;/&nbsp; Exercises</div>

    <h1 class="section-title">Exercises</h1>
    <p class="section-sub">Four ways to practice: translate, recognize, pinyin, and syntax. Use the filter chips to focus on one type.</p>

    <div id="filter-row" class="chip-row" role="tablist" aria-label="Exercise type"></div>

    <div class="score-line">
      <div>Score: <strong id="score">0</strong> / <span id="total">0</span> · <span id="qpos">Question 1</span></div>
      <button id="reset-btn" class="reset-btn" type="button">reset progress</button>
    </div>

    <div class="exercise-prompt">
      <div class="label" id="prompt-header">Translate to Chinese</div>
      <div class="english" id="english-prompt">—</div>
    </div>

    <div id="exercise-stage" class="exercise-stage"></div>

    <div class="exercise-feedback" id="feedback"></div>

    <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
      <button class="btn" id="next-btn" type="button">Next →</button>
      <button class="btn btn-ghost" id="prev-btn" type="button">← Previous</button>
    </div>
  </main>

  <script type="module" src="../scripts/exercises.js"></script>
</body>
</html>
