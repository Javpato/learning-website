    <h1 class="section-title">Ejercicios</h1>
    <p class="section-sub">Cuatro formas de practicar: traducir, reconocer, pinyin y sintaxis. Usa los filtros para centrarte en un solo tipo.</p>

    <div id="filter-row" class="chip-row" role="tablist" aria-label="Tipo de ejercicio"></div>

    <div class="score-line">
      <div>Puntuación: <strong id="score">0</strong> / <span id="total">0</span> · <span id="qpos">Pregunta 1</span></div>
      <button id="reset-btn" class="reset-btn" type="button">reiniciar progreso</button>
    </div>

    <div class="exercise-prompt">
      <div class="label" id="prompt-header">Traduce al chino</div>
      <div class="english" id="english-prompt">—</div>
    </div>

    <div id="exercise-stage" class="exercise-stage"></div>

    <div class="exercise-feedback" id="feedback"></div>

    <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
      <button class="btn" id="next-btn" type="button">Siguiente →</button>
      <button class="btn btn-ghost" id="prev-btn" type="button">← Anterior</button>
    </div>
