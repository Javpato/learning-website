# Per-project manim overrides. Picked up automatically when manimgl is run
# from learning-website/ (or one of its subdirectories).
#
# Effective values (after base joins each subdir):
#   directories.output  =>  media/clips
#   directories.raster_images => media/raster
#   directories.latex_cache   =>  media/latex_cache
#
# Rendered videos land at: learning-website/media/clips/<SceneName>.mp4

directories:
  mirror_module_path: false
  base: "media"
  subdirs:
    output: "clips"
    raster_images: "raster"
    vector_images: "vector"
    three_d_models: "three_d_models"
    sounds: "sounds"
    data: "data"
    downloads: "downloads"
    latex_cache: "latex_cache"

camera:
  # Match the site's --bg (#0e1116) so embedded clips blend with the page.
  background_color: "#0e1116"
  resolution: (1920, 1080)
  fps: 30
  background_opacity: 1.0
