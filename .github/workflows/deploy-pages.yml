name: Deploy to GitHub Pages

# Publishes the whole site to GitHub Pages on every push to main:
#   - the legacy static site at the root (index.html, math/, es/, …)
#   - the Next.js platform, statically exported, under /platform/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build platform (static export)
        working-directory: platform
        env:
          GITHUB_PAGES: "true"
          # 399 KaTeX-heavy MDX files (141 units × 3 locales) exceed Node's
          # default heap. The webpack compile alone peaked past 8 GB once the
          # analyse-convergence track landed (exit 134, "Ineffective
          # mark-compacts near heap limit"). The runner has 16 GB, so 12 GB is
          # the practical ceiling — above that the kernel OOM-killer takes the
          # process (exit 137) before V8 can give up cleanly.
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: |
          npm ci
          npm run build

      - name: Assemble _site (legacy root + exported platform)
        run: |
          mkdir -p _site
          # copy the legacy static site (everything except build/infra dirs)
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'platform' \
            --exclude 'node_modules' \
            --exclude '_site' \
            ./ _site/
          # mount the exported Next app under /platform
          mkdir -p _site/platform
          cp -r platform/out/. _site/platform/
          # disable Jekyll so the _next/ folder is served verbatim
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
